id: gray-butterfly
title: Grey butterfly in profile
description: A grey butterfly seen from the side with its wings closed over its back, facing right. The pale grey-beige wings carry darker mottled bands and several black eyespots ringed in white, one large on the forewing and a row of smaller ones on the hindwing; the dark body, thin legs and two long clubbed antennae point to the right. The background is transparent.
