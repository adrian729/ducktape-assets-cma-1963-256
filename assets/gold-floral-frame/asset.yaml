usage_notes:
  - Fixed complete frame; place it as one image and put content inside the arched opening. The four sides are of different thickness and the opening is arched, so it is not a nine-slice border and has no frame atlas.
  - The five single flowers, butterflies and bird of this set are cut from this border and can be scattered around it in the same manner.
