# descriptive: find it and understand it
id: gold-floral-frame
title: Strewn-flower border with arched opening
description: A complete page border on a textured gold ground with a tall round-arched transparent opening edged by a thin dark red rule; the left pillar is wide, the right one narrow, the bottom band widest and the top only a sliver above the arch. Scattered on the gold with painted shadows are pink wild roses, a crimson double rose, blue cornflowers and star flowers, pansies, pale lilac flowers, green buds, grey stems and curled silvery acanthus leaves, three butterflies (orange, grey, brown) and a small grey-brown bird with a blue wing patch at the lower left. The outside is transparent.
