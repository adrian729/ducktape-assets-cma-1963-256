title: Small bird with blue wing patch
description: A small songbird standing in profile and facing left, with a grey-brown head and back, a dark pointed beak, a round dark eye, a cream breast streaked with brown, a bright blue patch on the folded wing, a short barred tail and two thin dark legs with spread claws. There is no ground under the feet; the background is transparent.
